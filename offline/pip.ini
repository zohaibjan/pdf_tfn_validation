# Make pip work fully offline from the bundled wheels.
#
# Option A (recommended): just run install.bat — no config needed.
#
# Option B: make EVERY pip command on this machine use the local folder.
#   1. Edit the find-links path below to the real location of the wheels
#      folder on the client machine (use the absolute path).
#   2. Copy this file to:  %APPDATA%\pip\pip.ini
#      (create the 'pip' folder if it does not exist)
#
# After that, `pip install file_flag` works with no internet.

[global]
no-index = true
find-links = C:\path\to\file_flag\offline\wheels
