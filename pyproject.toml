[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-pii-scanner"
version = "0.1.0"
description = "Stratified sampling and multi-threaded TFN/PII/GRI detection in PDFs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.24",
    "PyYAML>=6.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "reportlab>=4.0"]

[project.scripts]
pdf-pii-scanner = "pdf_pii_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
